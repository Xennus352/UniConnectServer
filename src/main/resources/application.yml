server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-aged-night-ayo79t27-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_rBcki3bLJ7pa}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 45000

  jpa:
    # Schema is owned by database/migrations/001_initial_schema.sql.
    # Validate keeps entities in sync with the migrated schema.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-env-please-must-be-at-least-32-bytes}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

storage:
  # "local" = disk under base-dir; "supabase" only when URL + key are provided (no SDK needed, REST API).
  mode: ${STORAGE_MODE:local}
  base-dir: ${STORAGE_BASE_DIR:./uploads}
  supabase-url: ${SUPABASE_URL:}
  supabase-service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  supabase-bucket: ${SUPABASE_BUCKET:exam-results}

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 200MB